# Each rule is proven against a reference EVTX, pinned to an exact commit.
# v1: community logs (sbousseaden). v2: logs regenerated with Atomic Red Team in a home lab.
upstream:
  repo: sbousseaden/EVTX-ATTACK-SAMPLES
  commit: 4ceed2f4706daf601c212a8f91c113dd85349a2c

tests:
  - rule: rules/credential_access/win_lsass_memdump_comsvcs.yml
    sample: "Credential Access/sysmon_10_1_memdump_comsvcs_minidump.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
  - rule: rules/execution/win_unmanaged_powershell_load.yml
    sample: "Defense Evasion/de_unmanagedpowershell_psinject_sysmon_7_8_10.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
    # The same attack replayed with the host process renamed (decision 11):
    # an implant named after a PowerShell host must still fire, the genuine
    # installed hosts must not.
    variants:
      - name: implant named pwsh.exe in a user-writable folder
        set: {Image: 'C:\Users\Public\pwsh.exe'}
        min_hits: 1
      - name: implant in a fake PowerShell 7 folder outside Program Files
        set: {Image: 'C:\Users\Public\PowerShell\7\pwsh.exe'}
        min_hits: 1
      - name: implant named powershell.exe in a user-writable folder
        set: {Image: 'C:\Users\Public\powershell.exe'}
        min_hits: 1
      - name: PowerShell 7, MSI install (x64)
        set: {Image: 'C:\Program Files\PowerShell\7\pwsh.exe'}
        max_hits: 0
      - name: PowerShell 7, MSI install (x86)
        set: {Image: 'C:\Program Files (x86)\PowerShell\7\pwsh.exe'}
        max_hits: 0
      - name: PowerShell 7 preview, MSI install
        set: {Image: 'C:\Program Files\PowerShell\7-preview\pwsh.exe'}
        max_hits: 0
      - name: PowerShell 7, Microsoft Store (MSIX) install
        set: {Image: 'C:\Program Files\WindowsApps\Microsoft.PowerShell_7.4.6.0_x64__8wekyb3d8bbwe\pwsh.exe'}
        max_hits: 0
  - rule: rules/persistence/win_susp_scheduled_task_creation.yml
    sample: "AutomatedTestingTools/Malware/rundll32_cmd_schtask.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
  - rule: rules/persistence/win_run_key_persistence.yml
    sample: "Persistence/evasion_persis_hidden_run_keyvalue_sysmon_13.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
  - rule: rules/privilege_escalation/win_uac_bypass_eventvwr.yml
    sample: "Privilege Escalation/Sysmon_13_1_UAC_Bypass_EventVwrBypass.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
  - rule: rules/stealth/win_rundll32_proxy_execution.yml
    sample: "Execution/exec_sysmon_1_11_lolbin_rundll32_zipfldr_RouteTheCall.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
  - rule: rules/command_and_control/win_netsh_portproxy.yml
    sample: "Defense Evasion/de_portforward_netsh_rdp_sysmon_13_1.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
  - rule: rules/defense_impairment/win_security_log_cleared.yml
    sample: "Defense Evasion/DE_1102_security_log_cleared.evtx"
    min_hits: 1
    kusto_pipeline: azure_monitor
  - rule: rules/execution/win_wmiexec_shell_spawn.yml
    sample: "Lateral Movement/LM_wmiexec_impacket_sysmon_whoami.evtx"
    min_hits: 1
    kusto_pipeline: microsoft_xdr
