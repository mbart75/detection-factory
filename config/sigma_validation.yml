# Two semantic validators are disabled because they download reference data
# from moving sources at run time (ATT&CK from the master branch of
# mitre-attack/attack-stix-data, D3FEND from d3fend.mitre.org), so a release
# upstream could change the result of this stage with no change in this repo.
# ATT&CK tags are checked instead by scripts/build_layer.py against a pinned,
# committed extract (config/attack/). No rule uses D3FEND tags.
# Structure and schema validation stay on. See docs/decisions.md, decision 3.
validators:
  - all
  - -attacktag
  - -d3_fendtag
