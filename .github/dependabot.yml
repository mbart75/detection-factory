# Keeps the SHA-pinned actions in ci.yml current. Python dependencies are
# locked with hashes and updated deliberately (docs/decisions.md, decision 9).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # wait a week before adopting a new release: a compromised version is
    # usually detected and pulled within days
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
